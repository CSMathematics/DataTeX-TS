[package]
name = "DataTeX"
version = "2.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "DataTeX"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "datatex_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stoicheia-engine = { path = "crates/stoicheia-engine" }
tauri-plugin-fs = "2.4.4"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-clipboard-manager = "2"
# tauri-plugin-sql removed to avoid conflict with sqlx
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["full"] }
directories = "5.0"
walkdir = "2.5.0"
uuid = { version = "1.19.0", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
rayon = "1.10"
pdfium-render = "0.9.3"
image = "0.25"
# Git integration & Local History
git2 = "0.19"
sha2 = "0.10"
similar = "2.6"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
# Texlab auto-download
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
flate2 = "1.0"
tar = "0.4"
zip = "2.2"

# PDF rasterization and encoding are hot paths during development as well as
# release builds. Keep these dependencies optimized without slowing down
# recompilation of the application crate itself.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.pdfium-render]
opt-level = 3

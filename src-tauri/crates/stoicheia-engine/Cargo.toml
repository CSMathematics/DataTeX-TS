[package]
name = "stoicheia-engine"
version = "1.2.2"
description = "Stoicheia parser, geometry, and exact SVG preview engine for DataTeX"
authors = ["Spyros"]
edition = "2021"
publish = false

[lib]
name = "stoicheia_engine"
path = "src/lib.rs"

[dependencies]
nom = "7.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = [] }
tokio = { version = "1", features = ["process", "fs", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
